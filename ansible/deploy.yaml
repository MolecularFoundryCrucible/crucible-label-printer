---
- name: Deploy application
  hosts: crucible_print_servers
  # no play-level become — connect as lab, elevate only where needed

  vars:
    gcp_project: mf-crucible
    app_dir: /home/lab/crucible-label-printer
    repo_url: https://github.com/MolecularFoundryCrucible/crucible-label-printer.git
    service_name: crucible-label-printer
    get_secret_cmd: "gcloud secrets versions access latest --project={{ gcp_project }} --secret="
    ptouch_src: /home/lab/ptouch-print-src

  tasks:
    # --- Initial setup (root for apt) ---
    - name: Install system apt packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - acl
          - cmake
          - build-essential
          - libusb-1.0-0-dev
          - libusb-1.0-0
          - gettext
          - libgd-dev
        state: present
        update_cache: true
      become: true
      tags: [setup, apt]

    - name: Add lab user to lp group for printer USB access
      ansible.builtin.user:
        name: lab
        groups: lp
        append: true
      become: true
      tags: [setup] 

    - name: Install uv (official installer)
      ansible.builtin.shell: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        creates: /home/lab/.local/bin/uv
      tags: [setup]
      # runs as lab -> uv installed in lab's ~/.local/bin

    # TODO add tailscale setup

    - name: Pull latest ptouch-print repository
      ansible.builtin.git:
        repo: "https://git.familie-radermacher.ch/linux/ptouch-print.git"
        dest: "{{ ptouch_src }}"
        version: master
        force: true  # compile.sh dirties the tree; wipe local changes on re-run
      register: ptouch_clone
      tags: [setup, compile_ptouch]

    - name: Compile ptouch-print via bundled compile.sh
      ansible.builtin.command:
        cmd: sh compile.sh
        chdir: "{{ ptouch_src }}"
        #creates: "{{ ptouch_src }}/build/ptouch-print"
      when: ptouch_clone.changed
      tags: [setup, compile_ptouch]

    - name: Copy compiled ptouch-print binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ ptouch_src }}/build/ptouch-print"
        dest: "/home/lab/.local/bin/ptouch-print"
        owner: "lab"
        group: "lab"
        mode: "0755"
        remote_src: true      # source is on the target host, not the control node
      when: ptouch_clone.changed
      tags: [setup, compile_ptouch]

    # --- Deploy: code ---
    - name: Pull latest git
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
      notify: Restart services
      tags: [git, deploy]

    - name: Sync venv to lockfile (removes stray packages)
      ansible.builtin.command:
        cmd: /home/lab/.local/bin/uv sync
        chdir: "{{ app_dir }}"
      notify: Restart services
      tags: [git, deploy]

    # --- Secrets ---
    - name: Fetch mqtt password from Google Secret Manager
      ansible.builtin.set_fact:
        mqtt_password: "{{ lookup('pipe', get_secret_cmd ~ 'mqtt-crucible-printers-passwd') }}"
      no_log: true # hide logs so password doesn't leak
      tags: [secrets]

    - name: Render secret-bearing .env file
      ansible.builtin.template:
        src: dot_env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      no_log: true
      tags: [secrets, config]

    # --- Service (root for systemd) ---
    - name: Symlink repo unit file into /etc/systemd/system
      ansible.builtin.file:
        src: "{{ app_dir }}/{{ service_name }}.service"
        dest: "/etc/systemd/system/{{ service_name }}.service"
        state: link
      become: true
      tags: [setup, deploy]

    - name: Enable and start service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started
        daemon_reload: true
      become: true
      tags: [setup, deploy]

  handlers:
    - name: Restart services
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true
      become: true